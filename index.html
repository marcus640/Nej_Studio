<script>
/* =====================================================
   NEJ STUDIO — ULTRA COSMIC ENGINE
===================================================== */

const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);

/* ===============================
   🌠 RANDOM LIVE STARS
================================ */
const starCanvas = document.createElement("canvas");
starCanvas.id = "starCanvas";
document.body.appendChild(starCanvas);
const ctx = starCanvas.getContext("2d");

function resizeCanvas(){
  starCanvas.width = window.innerWidth;
  starCanvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener("resize", resizeCanvas);

let stars = [];

function createStar(){
  return {
    x: Math.random() * starCanvas.width,
    y: Math.random() * starCanvas.height,
    r: Math.random() * 2 + 0.5,
    alpha: Math.random(),
    speed: Math.random() * 0.02 + 0.005
  };
}

for(let i=0;i<180;i++){
  stars.push(createStar());
}

function drawStars(){
  ctx.clearRect(0,0,starCanvas.width,starCanvas.height);
  stars.forEach(s=>{
    s.alpha += s.speed;
    if(s.alpha <= 0 || s.alpha >= 1) s.speed *= -1;

    ctx.beginPath();
    ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
    ctx.fillStyle = `rgba(170,120,255,${s.alpha})`;
    ctx.fill();
  });
  requestAnimationFrame(drawStars);
}
drawStars();

/* ===============================
   🔮 PARALLAX
================================ */
document.addEventListener("mousemove", e=>{
  const x = (e.clientX / window.innerWidth - 0.5) * 20;
  const y = (e.clientY / window.innerHeight - 0.5) * 20;
  starCanvas.style.transform = `translate(${x}px,${y}px)`;
});

/* ===============================
   ✨ PARTICLES ON CLICK
================================ */
function createParticles(x,y){
  for(let i=0;i<12;i++){
    const p = document.createElement("div");
    p.className = "click-particle";
    document.body.appendChild(p);

    const angle = Math.random()*Math.PI*2;
    const dist = Math.random()*60+20;
    const dx = Math.cos(angle)*dist;
    const dy = Math.sin(angle)*dist;

    p.style.left = x+"px";
    p.style.top = y+"px";
    p.style.background = "rgba(170,120,255,1)";
    p.animate([
      {transform:"translate(0,0)", opacity:1},
      {transform:`translate(${dx}px,${dy}px)`, opacity:0}
    ],{
      duration:700,
      easing:"ease-out"
    });

    setTimeout(()=>p.remove(),700);
  }
}

document.addEventListener("click",e=>{
  if(e.target.closest(".cosmic-btn")){
    createParticles(e.clientX,e.clientY);
  }
});

/* ===============================
   🎵 COSMIC SOUND
================================ */
const warpSound = new Audio("https://assets.mixkit.co/active_storage/sfx/2018/2018-preview.mp3");
warpSound.volume = 0.4;

/* ===============================
   🌀 WARP SPEED
================================ */
function warpEffect(){
  let warpStars = [];
  for(let i=0;i<400;i++){
    warpStars.push({
      x: starCanvas.width/2,
      y: starCanvas.height/2,
      angle: Math.random()*Math.PI*2,
      speed: Math.random()*8+2
    });
  }

  let frame = 0;

  function animateWarp(){
    ctx.fillStyle="rgba(0,0,0,0.4)";
    ctx.fillRect(0,0,starCanvas.width,starCanvas.height);

    warpStars.forEach(s=>{
      s.x += Math.cos(s.angle)*s.speed;
      s.y += Math.sin(s.angle)*s.speed;

      ctx.beginPath();
      ctx.moveTo(starCanvas.width/2,starCanvas.height/2);
      ctx.lineTo(s.x,s.y);
      ctx.strokeStyle="rgba(180,120,255,0.8)";
      ctx.stroke();
    });

    frame++;
    if(frame<25){
      requestAnimationFrame(animateWarp);
    }
  }
  animateWarp();
}

/* ===============================
   🚀 GO WEB BEHAVIOR
================================ */
const goBtn = $("#goBtn");
const entryOverlay = $("#entryOverlay");
const mainContent = $("#mainContent");

if(goBtn){
  goBtn.addEventListener("click",()=>{
    warpSound.play().catch(()=>{});
    warpEffect();

    setTimeout(()=>{
      entryOverlay.style.opacity="0";
      setTimeout(()=>{
        entryOverlay.style.display="none";
        mainContent.setAttribute("aria-hidden","false");
      },600);
    },500);
  });
}

/* ===============================
   STYLE INJECTION
================================ */
const style = document.createElement("style");
style.innerHTML = `
#starCanvas{
  position:fixed;
  inset:0;
  z-index:5;
  pointer-events:none;
}
.click-particle{
  position:fixed;
  width:6px;
  height:6px;
  border-radius:50%;
  pointer-events:none;
}
`;
document.head.appendChild(style);

</script>
